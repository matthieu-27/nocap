# mytheory — pre-commit config
# Install:   pre-commit install
#            pre-commit install --hook-type pre-push   (fallow review gate)
# Update:    pre-commit autoupdate
#
# Policy: off-the-shelf linters, configured natively — no custom scanner
# scripts. Biome runs via the official biomejs/pre-commit mirror (isolated
# node env, so no Windows PATH/bunx resolution issues); keep its rev in the
# same minor as the @biomejs/biome devDependency in package.json.
#
# Biome (biome.json, recommended preset) already covers the old hand-rolled
# checks: empty catch (noEmptyBlock), useless catch, explicit any,
# non-null assertions, exhaustive deps, formatting, import organization.
# apps/worker does not exist yet — add a ruff-pre-commit hook when it does.

repos:
  # ---------- hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: ^styles/ # vendored vale package — not ours to reformat
      - id: end-of-file-fixer
        exclude: ^styles/
      - id: check-added-large-files
        args: [--maxkb=500]

  # ---------- typescript/javascript: biome ----------
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        args: [--error-on-warnings]

  # ---------- prose: vale (de-blab + write-good) ----------
  # Binary: vale on PATH (installed to ~/.local/bin). The write-good package
  # under styles/ is committed for offline runs; `vale sync` refreshes it.
  # What gets linted is scoped in .vale.ini, not here.
  - repo: local
    hooks:
      - id: vale
        name: vale — de-blab markdown
        entry: vale
        language: system
        files: \.md$

  # ---------- review: fallow (pre-push stage) ----------
  # Findings get addressed or explicitly justified, never ignored.
  # --base origin/main: gate what the outgoing commits introduce (gate=new-only,
  # the repo's documented policy) — inherited findings on untouched code don't
  # block. pass_filenames: fallow computes its own diff; positional args error.
  - repo: local
    hooks:
      - id: fallow
        name: fallow — AI review of outgoing changes
        entry: npx fallow audit --base origin/main --quiet --gate-marker pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
