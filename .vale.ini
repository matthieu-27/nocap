# mytheory — prose lint (vale.sh)
# Install:  vale sync          (fetches Packages below into styles/)
# Run:      vale .             (pre-commit runs it on staged .md too)
#
# Section order matters: a later section matching the same file wins, so the
# exclusions sit after the general [*.md] rule.
StylesPath = styles
MinAlertLevel = warning

# Off-the-shelf styles, synced from the registry — see preconfig policy.
Packages = write-good

[*.md]
BasedOnStyles = write-good, de-blab

# Dated artifacts and vendored notes stay as written — no value in
# de-blabbing history. Empty BasedOnStyles disables all rules for a path.
[docs/superpowers/**]
BasedOnStyles =

# AGENTS.md's task matrix lives inside fallow's generated markers —
# de-blabbing it fights the generator.
[AGENTS.md]
BasedOnStyles =

[.agents/**]
BasedOnStyles =

[.migration/**]
BasedOnStyles =

[.superpowers/**]
BasedOnStyles =

[styles/**]
BasedOnStyles =
