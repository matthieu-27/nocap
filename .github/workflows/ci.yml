# CI gates for NoCaP — the remote half of the lint story: pre-commit gates
# the author, this gates every PR (and main, which autoDeploy ships straight
# to Render).
#
# The api job runs against a local postgres:18 service container: the tests
# truncate and arrange their own data, and GitHub's US runners talking to
# Neon Frankfurt pay ~100 ms per round trip — enough to blow bun's 5 s test
# timeout (measured: "passing" tests at 3.6-4.6 s, 28 timeouts). Production
# still runs Neon; same engine, same major version.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No lockfile in git (*-lock.json is gitignored) — plain install.
      - run: bun install
      - run: bun run check # biome, zero warnings
      - run: bun run typecheck # react-router typegen + tsc
        working-directory: apps/web
      - run: bun run typecheck # tsc --noEmit
        working-directory: apps/api

  unit-tests:
    name: vitest (shared + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test

  api-tests:
    name: bun test (api, real postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nocap
          POSTGRES_PASSWORD: nocap
          POSTGRES_DB: nocap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nocap:nocap@localhost:5432/nocap
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Migrate
        working-directory: apps/api
        run: bun run db:migrate

      - name: Test
        working-directory: apps/api
        run: bun test
