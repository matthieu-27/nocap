# de-blab: filler phrases → their plain equivalents.
# The only custom prose rule; everything else comes from write-good.
extends: substitution
message: "De-blab: use '%s' instead of '%s'."
level: warning
ignorecase: true
action:
  name: replace
swap:
  "in order to": to
  "due to the fact that": because
  "in the event that": if
  "at this point in time": now
  "in the near future": soon
  "a majority of": most
  "prior to": before
  "subsequent to": after
  "utilize": use
  "utilization": use
  "in the process of": ""
  "it should be noted that": ""
  "it is important to note that": ""
  "needless to say": ""
  "as a matter of fact": ""
  "for all intents and purposes": ""
